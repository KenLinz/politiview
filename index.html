  <body class="booting">
    <script>
      // Runs before anything else, so even a page that fails to start can say how far it got. It only reports on the
      // private server, and only sends what went wrong, the browser's name and the screen size.
      (function () {
        var sent = 0;
        function report(kind, detail) {
          if (location.port !== "8026" || sent++ > 12 || !navigator.sendBeacon) return;
          try {
            navigator.sendBeacon("/api/report", JSON.stringify({ kind: kind, detail: String(detail || "").slice(0, 500), ua: navigator.userAgent, w: innerWidth, h: innerHeight }));
          } catch (e) { /* Nothing useful can be done if the report itself fails. */ }
        }
        window.__report = report;
        report("start");
        addEventListener("error", function (e) {
          var what = e.message || "Could not load " + ((e.target && (e.target.src || e.target.href)) || "something");
          report("error", what + " " + (e.filename || "") + ":" + (e.lineno || ""));
          var line = document.getElementById("boot-line");
          if (line) line.textContent = "Something Went Wrong: " + what;
        }, true);
        addEventListener("unhandledrejection", function (e) {
          var why = e.reason && (e.reason.stack || e.reason.message) || e.reason;
          report("rejection", why);
          var line = document.getElementById("boot-line");
          if (line) line.textContent = "Something Went Wrong: " + (e.reason && e.reason.message || e.reason);
        });
      })();
    </script>
